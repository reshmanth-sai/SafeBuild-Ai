<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeBuild AI — Unified Worker Incident Timeline</title>
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --surface-dark: #121826;
            --card-bg: #1a2234;
            --card-border: #26334d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --danger-red: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --warning-orange: #f97316;
            --warning-bg: rgba(249, 115, 22, 0.15);
            --success-green: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.15);
            --purple-accent: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-dark);
            border: 1px solid var(--card-border);
            padding: 20px 28px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* WORKER SELECTOR BAR */
        .selector-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-dark);
            border: 1px solid var(--card-border);
            padding: 16px 24px;
            border-radius: 14px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 14px;
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            outline: none;
            width: 140px;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        .btn-load {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-load:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(34, 197, 94, 0.15);
            color: var(--success-green);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success-green);
            box-shadow: 0 0 8px var(--success-green);
        }

        /* METRICS SUMMARY */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .summary-card {
            background: var(--surface-dark);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .summary-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .summary-val {
            font-size: 28px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        /* TIMELINE FEED STYLING */
        .timeline-container {
            position: relative;
            padding-left: 36px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 8px;
        }

        /* Vertical Line */
        .timeline-container::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 20px;
            bottom: 20px;
            width: 2px;
            background: var(--card-border);
        }

        .timeline-node {
            position: relative;
            background: var(--surface-dark);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        .timeline-node:hover {
            border-color: var(--accent-blue);
            transform: translateX(4px);
        }

        /* Node Bullet Point on Line */
        .timeline-node::before {
            content: '';
            position: absolute;
            left: -28px;
            top: 26px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 3px solid var(--text-muted);
            z-index: 2;
        }

        .timeline-node.source-emergency::before {
            border-color: var(--danger-red);
            background: var(--danger-red);
            box-shadow: 0 0 10px var(--danger-red);
        }

        .timeline-node.source-safety::before {
            border-color: var(--warning-orange);
            background: var(--warning-orange);
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .event-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .event-icon {
            font-size: 20px;
        }

        .event-name {
            font-size: 16px;
            font-weight: 700;
        }

        .source-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tag-cv {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .tag-wearable {
            background: rgba(168, 85, 247, 0.15);
            color: var(--purple-accent);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .node-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text-muted);
        }

        .node-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 16px;
        }

        .detail-item {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text-muted);
        }

        .detail-item strong {
            color: var(--text-main);
        }

        /* RESOLUTION STATUS BADGES & BUTTON */
        .status-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .pill-open {
            background: var(--danger-red);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .pill-resolved {
            background: #4b5563;
            color: #d1d5db;
        }

        .btn-resolve-sm {
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-resolve-sm:hover {
            background: #22c55e;
        }

        .empty-state {
            background: var(--surface-dark);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="header-title-box">
                <div class="brand-icon">📜</div>
                <div>
                    <h1>SafeBuild AI — Unified Incident Timeline</h1>
                    <div class="subtitle">Chronological Cross-Modal Safety & Emergency Telemetry Feed</div>
                </div>
            </div>
            <div class="status-badge" id="statusBadge">
                <span class="pulse-dot"></span>
                <span id="statusText">LIVE TIMELINE</span>
            </div>
        </header>

        <!-- WORKER SELECTOR BAR -->
        <div class="selector-bar">
            <div class="input-group">
                <label for="workerInput">Target Worker ID:</label>
                <input type="text" id="workerInput" value="W001" placeholder="e.g. W001">
                <button class="btn-load" onclick="fetchTimeline()">Load Timeline</button>
            </div>
            <div class="node-time">
                Auto-refreshing every 2.0s • Last update: <span id="lastPollTime">--:--:--</span>
            </div>
        </div>

        <!-- METRICS SUMMARY -->
        <div class="summary-grid">
            <div class="summary-card">
                <span class="summary-label">Target Worker</span>
                <span class="summary-val" id="summaryWorker" style="color: var(--accent-blue);">W001</span>
            </div>
            <div class="summary-card">
                <span class="summary-label">Total Incidents</span>
                <span class="summary-val" id="summaryTotal">0</span>
            </div>
            <div class="summary-card">
                <span class="summary-label">Active Emergencies</span>
                <span class="summary-val" id="summaryEmergency" style="color: var(--danger-red);">0</span>
            </div>
            <div class="summary-card">
                <span class="summary-label">PPE Violations</span>
                <span class="summary-val" id="summaryPPE" style="color: var(--warning-orange);">0</span>
            </div>
        </div>

        <!-- CHRONOLOGICAL TIMELINE FEED -->
        <div id="timelineContainer" class="timeline-container">
            <div class="empty-state">
                <div class="empty-icon">📡</div>
                <div>Fetching worker timeline feed...</div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT POLLING & RENDERING -->
    <script>
        const BASE_TIMELINE_URL = "http://localhost:8000/events/timeline/";
        const POLL_INTERVAL_MS = 2000;

        let activeWorkerId = "W001";
        let timelineData = [];

        const EVENT_ICONS = {
            'MISSING_HELMET': '🪖',
            'MISSING_VEST': '🦺',
            'ZONE_INTRUSION': '⚠️',
            'FALL_DETECTED': '🚨',
            'SOS': '🚨',
            'IMU_FALL': '💥'
        };

        function formatRelativeTime(isoString) {
            try {
                const date = new Date(isoString);
                const now = new Date();
                const diffSec = Math.floor((now - date) / 1000);

                if (isNaN(diffSec) || diffSec < 0) return "Just now";
                if (diffSec < 60) return `${diffSec}s ago`;
                if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m ago`;
                return date.toLocaleTimeString();
            } catch (e) {
                return isoString;
            }
        }

        async function resolveEmergency(eventId, event) {
            event.stopPropagation();
            try {
                const res = await fetch(`http://localhost:8000/events/emergency/${eventId}/resolve`, {
                    method: 'PATCH'
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                fetchTimeline();
            } catch (err) {
                alert(`Failed to resolve emergency #${eventId}: ${err.message}`);
            }
        }

        function updateSummaryMetrics(data) {
            document.getElementById('summaryWorker').textContent = activeWorkerId;
            document.getElementById('summaryTotal').textContent = data.length;
            document.getElementById('summaryEmergency').textContent = data.filter(item => item.source === 'emergency' && item.status === 'open').length;
            document.getElementById('summaryPPE').textContent = data.filter(item => item.event_type === 'MISSING_HELMET' || item.event_type === 'MISSING_VEST').length;
        }

        function renderTimeline() {
            const container = document.getElementById('timelineContainer');
            
            if (timelineData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🛡️</div>
                        <div>No incident records found for worker <strong>${activeWorkerId}</strong>.</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = timelineData.map(item => {
                const isEmergency = (item.source === 'emergency');
                const icon = EVENT_ICONS[item.event_type] || '⚠️';
                const relTime = formatRelativeTime(item.timestamp);
                const formattedTime = new Date(item.timestamp).toLocaleTimeString();

                return `
                    <div class="timeline-node ${isEmergency ? 'source-emergency' : 'source-safety'}">
                        <div class="node-header">
                            <div class="event-title-group">
                                <span class="event-icon">${icon}</span>
                                <span class="event-name">${item.event_type.replace('_', ' ')}</span>
                                <span class="source-tag ${isEmergency ? 'tag-wearable' : 'tag-cv'}">
                                    ${isEmergency ? '📡 WEARABLE BAND' : '🎥 AI VISION (CV)'}
                                </span>
                            </div>
                            <div class="node-time">
                                <strong>${relTime}</strong> <span style="font-size: 11px;">(${formattedTime})</span>
                            </div>
                        </div>

                        <div class="node-body">
                            ${isEmergency ? `
                                <div class="detail-item">Band ID: <strong>${item.band_id || 'B001'}</strong></div>
                                <div class="detail-item">Battery: <strong>${item.battery}%</strong></div>
                                <div class="detail-item">RSSI: <strong>${item.rssi} dBm</strong></div>
                                <div class="detail-item">Location: <strong>${item.zone || 'General Zone'}</strong></div>
                                <div>
                                    ${item.status === 'open' ? `
                                        <span class="status-pill pill-open">ACTIVE OPEN</span>
                                        <button class="btn-resolve-sm" onclick="resolveEmergency(${item.id}, event)">Mark Resolved</button>
                                    ` : `
                                        <span class="status-pill pill-resolved">RESOLVED</span>
                                    `}
                                </div>
                            ` : `
                                <div class="detail-item">Track ID: <strong>Track ${item.track_id}</strong></div>
                                <div class="detail-item">Severity: <strong style="color: ${item.severity === 'HIGH' ? 'var(--danger-red)' : 'var(--warning-orange)'}">${item.severity}</strong></div>
                                <div class="detail-item">Confidence: <strong>${Math.round((item.confidence || 0) * 100)}%</strong></div>
                                <div class="detail-item">Zone: <strong>${item.zone || 'Camera Feed'}</strong></div>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function fetchTimeline() {
            activeWorkerId = document.getElementById('workerInput').value.trim() || "W001";
            document.getElementById('lastPollTime').textContent = new Date().toLocaleTimeString();

            try {
                const res = await fetch(`${BASE_TIMELINE_URL}${activeWorkerId}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();
                timelineData = data;
                updateSummaryMetrics(data);
                renderTimeline();

                document.getElementById('statusBadge').style.opacity = '1';
                document.getElementById('statusText').textContent = `LIVE FEED (${activeWorkerId})`;
            } catch (err) {
                console.warn("[Timeline Warning] Backend unreachable:", err);
                document.getElementById('statusBadge').style.opacity = '0.5';
                document.getElementById('statusText').textContent = "OFFLINE";
            }
        }

        // WebSocket Fast-Path (Additive - polling remains primary fallback)
        function initWebSocketFastPath() {
            const WS_URL = "ws://localhost:8000/ws/events";
            let socket = null;

            function connect() {
                try {
                    socket = new WebSocket(WS_URL);
                    socket.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            if (data.source === 'safety' || data.source === 'emergency') {
                                fetchTimeline();
                            }
                        } catch (e) {}
                    };
                    socket.onclose = () => { setTimeout(connect, 5000); };
                    socket.onerror = () => { if (socket) socket.close(); };
                } catch (e) {
                    setTimeout(connect, 5000);
                }
            }
            connect();
        }

        // Initial fetch + 2.0s poll interval
        fetchTimeline();
        setInterval(fetchTimeline, POLL_INTERVAL_MS);
        initWebSocketFastPath();
    </script>
</body>
</html>
